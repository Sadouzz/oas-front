<div>
  <div class="mb-6">
    <h1 class="text-2xl font-extrabold text-oas-ink">Mon profil</h1>
    <p class="text-oas-muted text-sm mt-1">Modifiez vos informations personnelles</p>
  </div>

  @if (loading) {
    <div class="flex items-center justify-center py-10">
      <svg class="animate-spin h-6 w-6 text-oas-accent" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
    </div>
  } @else {
    <div class="bg-white rounded-2xl border border-oas-line overflow-hidden max-w-xl">
      <div class="p-5 border-b border-oas-line">
        <h2 class="text-sm font-bold text-oas-ink">Informations personnelles</h2>
      </div>
      <form [formGroup]="form" (ngSubmit)="save()" class="p-5 space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-oas-ink mb-1.5">Prénom</label>
            <input type="text" formControlName="firstName"
              class="w-full px-4 py-2.5 rounded-lg border border-oas-line bg-oas-bg text-sm focus:outline-none focus:ring-2 focus:ring-oas-accent/40 focus:border-oas-accent transition" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-oas-ink mb-1.5">Nom</label>
            <input type="text" formControlName="lastName"
              class="w-full px-4 py-2.5 rounded-lg border border-oas-line bg-oas-bg text-sm focus:outline-none focus:ring-2 focus:ring-oas-accent/40 focus:border-oas-accent transition" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-oas-ink mb-1.5">Téléphone</label>
          <input type="text" formControlName="phone"
            class="font-mono-data w-full px-4 py-2.5 rounded-lg border border-oas-line bg-oas-bg text-sm focus:outline-none focus:ring-2 focus:ring-oas-accent/40 focus:border-oas-accent transition" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-oas-ink mb-1.5">Email</label>
          <input type="email" formControlName="email"
            class="w-full px-4 py-2.5 rounded-lg border border-oas-line bg-oas-bg text-sm focus:outline-none focus:ring-2 focus:ring-oas-accent/40 focus:border-oas-accent transition" />
        </div>

        <app-alert [success]="successMessage" [error]="errorMessage"></app-alert>

        <div class="pt-2">
          <button type="submit" [disabled]="saving"
            class="bg-oas-accent hover:bg-oas-accent-dark disabled:opacity-60 text-white font-bold px-5 py-2.5 rounded-lg text-sm transition cursor-pointer">
            {{ saving ? 'Enregistrement...' : 'Enregistrer les modifications' }}
          </button>
        </div>
      </form>
    </div>
  }
</div>

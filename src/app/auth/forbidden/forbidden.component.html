<div class="min-h-screen flex items-center justify-center p-6" style="background: linear-gradient(160deg, #0c2742 0%, #0a1f36 100%);">
  <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-10 flex flex-col items-center text-center">

    <!-- Logo OAS -->
    <div class="flex items-center gap-3 mb-8">
      <div class="w-12 h-12 bg-oas-navy rounded-full flex items-center justify-center shadow-md">
        <img src="oas-logo.png" alt="OAS" class="w-8 h-8 object-contain">
      </div>
      <div class="text-left">
        <p class="font-extrabold text-oas-ink text-base leading-tight">OAS</p>
        <p class="text-[10px] font-semibold tracking-widest uppercase" style="color:#ef6c1a;">Orient Auto Service</p>
      </div>
    </div>

    <!-- Icône cadenas -->
    <div class="w-20 h-20 bg-oas-bad-bg rounded-full flex items-center justify-center mb-6">
      <svg lucideLock class="w-10 h-10 text-oas-bad"></svg>
    </div>

    <!-- Code erreur -->
    <p class="text-6xl font-extrabold text-oas-bad mb-2">403</p>

    <!-- Titre -->
    <h1 class="text-xl font-bold text-oas-ink mb-2">Accès refusé</h1>

    <!-- Description -->
    <p class="text-sm text-oas-muted mb-8">
      Vous n'avez pas les droits nécessaires pour accéder à cette page.
      Contactez un administrateur si vous pensez que c'est une erreur.
    </p>

    <!-- Bouton retour -->
    <button
      (click)="goBack()"
      class="w-full bg-oas-accent hover:bg-oas-accent-dark text-white font-bold py-3 rounded-lg transition text-sm cursor-pointer shadow-lg shadow-oas-accent/30"
    >
      Retour au tableau de bord
    </button>

  </div>
</div>

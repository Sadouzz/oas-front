<div class="min-h-screen bg-oas-bg flex flex-col">

  <header class="h-16 bg-white border-b border-oas-line flex items-center justify-between px-5 flex-shrink-0 shadow-sm">
    <a [routerLink]="paths.ordresReparation" class="flex items-center gap-2.5">
      <div class="w-9 h-9 bg-oas-navy rounded-full flex items-center justify-center flex-shrink-0">
        <img src="/oas-logo.png" alt="OAS" class="w-6 h-6 object-contain">
      </div>
      <div class="leading-tight">
        <p class="font-extrabold text-sm text-oas-ink">Espace Technicien</p>
        <p class="text-[10px] font-medium uppercase tracking-widest" style="color:#ef6c1a;">Orient Auto Service</p>
      </div>
    </a>

    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0"
           style="background:#13355c; border:2px solid #ef6c1a;">
        {{ initials }}
      </div>
      <span class="hidden sm:block text-sm font-semibold text-oas-ink">{{ fullName }}</span>
      <button (click)="logout()" title="Déconnexion"
              class="p-2 rounded-lg hover:bg-oas-bg text-oas-muted hover:text-oas-bad transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="flex-1 overflow-auto p-5">
    <router-outlet></router-outlet>
  </main>

</div>

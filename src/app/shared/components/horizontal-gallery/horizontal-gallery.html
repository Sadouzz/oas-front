<section #container class="min-h-screen md:h-screen bg-white overflow-hidden relative px-10 md:px-0 py-10 md:py-0 border-y border-oas-line">
  <!-- Decorative background grid -->
  <div class="absolute inset-0 pointer-events-none opacity-[0.03] bg-[linear-gradient(rgba(0,0,0,0.1)_1px,transparent_1px),linear-gradient(90deg,rgba(0,0,0,0.1)_1px,transparent_1px)] bg-[size:40px_40px]"></div>

  <div #scrollContainer class="h-full flex flex-col md:flex-row md:flex-nowrap items-center px-4 md:px-[10vw] gap-10 md:gap-0 w-full md:w-max" style="width: max-content;">

    <!-- Header Column -->
    <div class="w-full md:w-[40vw] shrink-0 md:pr-20 md:mx-20 mb-10 md:mb-0 relative z-10">
      <div class="relative flex flex-col-reverse">
        <h2 class="uppercase font-bold text-oas-navy-dark text-balance text-5xl md:text-7xl lg:text-8xl block tracking-tighter">
          {{ title }}
        </h2>
        <span class="w-full rotate-[-2deg] font-serif italic text-oas-accent -mb-1 md:-mb-2 xl:-mb-4 text-3xl md:text-4xl lg:text-5xl">
          {{ subtitle }}
        </span>
      </div>
      <p class="text-gray-700 mb-6 md:mb-10 text-base md:text-lg lg:text-xl mt-4 md:mt-6 font-medium">
        {{ description }}
      </p>
      <a routerLink="/realisations" class="inline-flex items-center gap-4 px-8 py-4 bg-oas-navy-dark text-white hover:bg-oas-accent hover:text-white transition-colors text-xs uppercase tracking-[0.2em] font-bold">
        <span>Toutes les réalisations</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>
    </div>

    <!-- Cards -->
    @for (zone of items; track zone.id; let i = $index) {
      <div
        class="w-full md:w-[60vw] h-[50vh] md:h-[70vh] shrink-0 md:mx-16 relative flex items-center group gallery-skew-target"
        style="transform-origin: bottom center; overflow: hidden;"
      >
        <!-- Vertical Typography on the left -->
        <div class="absolute bottom-12 -rotate-180 [writing-mode:vertical-rl] text-[8rem] font-black uppercase tracking-tighter text-oas-navy-dark/5 z-0 select-none hidden md:block">
          {{ zone.title }}
        </div>

        <!-- The actual card -->
        <a [routerLink]="zone.link" class="relative w-full h-full z-10 overflow-hidden border border-oas-line md:mr-20 block bg-black">
          <img
            [src]="zone.image"
            [alt]="zone.title"
            class="w-full h-full object-cover object-center opacity-70 grayscale md:group-hover:grayscale-0 md:group-hover:scale-105 transition-all duration-700 ease-out mix-blend-luminosity md:group-hover:mix-blend-normal"
          />

          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 md:via-oas-navy-dark/20 to-transparent p-6 md:p-12 flex flex-col justify-between">
            <div class="flex justify-between items-center">
              <div class="py-1 px-3 uppercase text-[10px] md:text-xs text-white bg-oas-accent border border-oas-accent/50 font-bold tracking-widest shadow-lg">
                <span>{{ zone.subtitle }}</span>
              </div>
              
              <div class="py-1 px-3 bg-black/60 backdrop-blur-sm border border-white/20">
                <span class="text-[10px] md:text-sm text-white font-medium uppercase tracking-wider">
                  {{ zone.date }}
                </span>
              </div>
            </div>

            <div>
              <h3 class="text-2xl md:text-3xl lg:text-4xl font-black uppercase text-white mb-2 md:mb-4 tracking-tighter">
                {{ zone.title }}
              </h3>
              <p class="text-xs md:text-sm text-gray-200 md:text-white/90 max-w-xl leading-relaxed line-clamp-3">
                {{ zone.description }}
              </p>
              <div class="w-12 h-1 bg-oas-accent mb-2 md:mb-6 mt-4 transition-all duration-500 group-hover:w-24"></div>
            </div>
          </div>
        </a>
      </div>
    }

    <div class="hidden md:block w-[20vw] shrink-0"></div> <!-- End padding -->
  </div>
</section>

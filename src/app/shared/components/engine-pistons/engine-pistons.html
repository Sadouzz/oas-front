<div class="engine-pistons-wrapper" [style.opacity]="opacity" aria-hidden="true">
  <svg viewBox="0 0 600 260" class="engine-svg">
    <defs>
      <!-- Gradient accentuation red pour les segments de piston -->
      <linearGradient id="pistonRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="var(--color-oas-accent)" stop-opacity="0.3" />
        <stop offset="50%" stop-color="var(--color-oas-accent)" stop-opacity="1" />
        <stop offset="100%" stop-color="var(--color-oas-accent)" stop-opacity="0.3" />
      </linearGradient>

      <!-- Glow filter discret -->
      <filter id="pistonGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Engine Block Header Outer Line -->
    <path
      d="M 20 20 L 580 20 M 20 30 L 580 30"
      stroke="var(--color-oas-navy-mid)"
      stroke-width="1.5"
      stroke-dasharray="8 4"
    />

    <!-- CYLINDERS (1 to 4) - Centrés sur chaque colonne (12.5%, 37.5%, 62.5%, 87.5%) -->
    <!-- Cylinder 1 (x: 75) -->
    <g class="cylinder-unit cyl-1" transform="translate(75, 40)">
      <!-- Cylinder Walls -->
      <line x1="-40" y1="0" x2="-40" y2="170" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" stroke-dasharray="4 3" />
      <line x1="40" y1="0" x2="40" y2="170" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" stroke-dasharray="4 3" />
      <!-- Piston Assembly (1-3-4-2 order: delay 0s) -->
      <g class="piston-assembly delay-1">
        <!-- Piston Crown & Body -->
        <rect x="-36" y="0" width="72" height="42" rx="0" fill="none" stroke="var(--color-oas-navy)" stroke-width="2" />
        <!-- Piston Rings (Red Accent) -->
        <line x1="-34" y1="8" x2="34" y2="8" stroke="url(#pistonRingGrad)" stroke-width="2" />
        <line x1="-34" y1="16" x2="34" y2="16" stroke="url(#pistonRingGrad)" stroke-width="2" />
        <line x1="-34" y1="24" x2="34" y2="24" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" />
        <!-- Gudgeon Pin / Axe de Piston -->
        <circle cx="0" cy="28" r="4" fill="var(--color-oas-accent)" />

        <!-- Connecting Rod (Bielle) -->
        <g class="connecting-rod rod-delay-1">
          <line x1="0" y1="28" x2="0" y2="105" stroke="var(--color-oas-accent)" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="0" cy="105" r="5" fill="none" stroke="var(--color-oas-navy)" stroke-width="2" />
        </g>
      </g>
      <!-- Crankshaft Journal Circle -->
      <circle cx="0" cy="150" r="22" fill="none" stroke="var(--color-oas-navy-mid)" stroke-width="1" stroke-dasharray="3 3" />
    </g>

    <!-- Cylinder 2 (x: 225) -->
    <g class="cylinder-unit cyl-2" transform="translate(225, 40)">
      <line x1="-40" y1="0" x2="-40" y2="170" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" stroke-dasharray="4 3" />
      <line x1="40" y1="0" x2="40" y2="170" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" stroke-dasharray="4 3" />
      <g class="piston-assembly delay-2">
        <rect x="-36" y="0" width="72" height="42" rx="0" fill="none" stroke="var(--color-oas-navy)" stroke-width="2" />
        <line x1="-34" y1="8" x2="34" y2="8" stroke="url(#pistonRingGrad)" stroke-width="2" />
        <line x1="-34" y1="16" x2="34" y2="16" stroke="url(#pistonRingGrad)" stroke-width="2" />
        <line x1="-34" y1="24" x2="34" y2="24" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" />
        <circle cx="0" cy="28" r="4" fill="var(--color-oas-accent)" />
        <g class="connecting-rod rod-delay-2">
          <line x1="0" y1="28" x2="0" y2="105" stroke="var(--color-oas-accent)" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="0" cy="105" r="5" fill="none" stroke="var(--color-oas-navy)" stroke-width="2" />
        </g>
      </g>
      <circle cx="0" cy="150" r="22" fill="none" stroke="var(--color-oas-navy-mid)" stroke-width="1" stroke-dasharray="3 3" />
    </g>

    <!-- Cylinder 3 (x: 375) -->
    <g class="cylinder-unit cyl-3" transform="translate(375, 40)">
      <line x1="-40" y1="0" x2="-40" y2="170" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" stroke-dasharray="4 3" />
      <line x1="40" y1="0" x2="40" y2="170" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" stroke-dasharray="4 3" />
      <g class="piston-assembly delay-3">
        <rect x="-36" y="0" width="72" height="42" rx="0" fill="none" stroke="var(--color-oas-navy)" stroke-width="2" />
        <line x1="-34" y1="8" x2="34" y2="8" stroke="url(#pistonRingGrad)" stroke-width="2" />
        <line x1="-34" y1="16" x2="34" y2="16" stroke="url(#pistonRingGrad)" stroke-width="2" />
        <line x1="-34" y1="24" x2="34" y2="24" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" />
        <circle cx="0" cy="28" r="4" fill="var(--color-oas-accent)" />
        <g class="connecting-rod rod-delay-3">
          <line x1="0" y1="28" x2="0" y2="105" stroke="var(--color-oas-accent)" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="0" cy="105" r="5" fill="none" stroke="var(--color-oas-navy)" stroke-width="2" />
        </g>
      </g>
      <circle cx="0" cy="150" r="22" fill="none" stroke="var(--color-oas-navy-mid)" stroke-width="1" stroke-dasharray="3 3" />
    </g>

    <!-- Cylinder 4 (x: 525) -->
    <g class="cylinder-unit cyl-4" transform="translate(525, 40)">
      <line x1="-40" y1="0" x2="-40" y2="170" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" stroke-dasharray="4 3" />
      <line x1="40" y1="0" x2="40" y2="170" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" stroke-dasharray="4 3" />
      <g class="piston-assembly delay-4">
        <rect x="-36" y="0" width="72" height="42" rx="0" fill="none" stroke="var(--color-oas-navy)" stroke-width="2" />
        <line x1="-34" y1="8" x2="34" y2="8" stroke="url(#pistonRingGrad)" stroke-width="2" />
        <line x1="-34" y1="16" x2="34" y2="16" stroke="url(#pistonRingGrad)" stroke-width="2" />
        <line x1="-34" y1="24" x2="34" y2="24" stroke="var(--color-oas-navy-mid)" stroke-width="1.5" />
        <circle cx="0" cy="28" r="4" fill="var(--color-oas-accent)" />
        <g class="connecting-rod rod-delay-4">
          <line x1="0" y1="28" x2="0" y2="105" stroke="var(--color-oas-accent)" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="0" cy="105" r="5" fill="none" stroke="var(--color-oas-navy)" stroke-width="2" />
        </g>
      </g>
      <circle cx="0" cy="150" r="22" fill="none" stroke="var(--color-oas-navy-mid)" stroke-width="1" stroke-dasharray="3 3" />
    </g>

    <!-- Bottom Crankshaft Line -->
    <path
      d="M 20 230 L 580 230"
      stroke="var(--color-oas-navy-mid)"
      stroke-width="1.5"
      stroke-dasharray="10 5"
    />
  </svg>
</div>

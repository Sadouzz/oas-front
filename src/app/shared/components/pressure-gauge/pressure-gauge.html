<div class="gauge-wrapper" title="Progression dans la page">
  <svg
    viewBox="0 0 130 115"
    class="gauge-svg"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true">

    <defs>
      <!-- Biseau métallique du cadran -->
      <radialGradient id="pg-bezel" cx="40%" cy="35%" r="65%">
        <stop offset="0%"   stop-color="#5a5a5a"/>
        <stop offset="50%"  stop-color="#2a2a2a"/>
        <stop offset="100%" stop-color="#111"/>
      </radialGradient>
      <!-- Face du cadran (fond sombre) -->
      <radialGradient id="pg-face" cx="50%" cy="40%" r="60%">
        <stop offset="0%"   stop-color="#1e2535"/>
        <stop offset="75%"  stop-color="#0d1422"/>
        <stop offset="100%" stop-color="#080e1a"/>
      </radialGradient>
      <!-- Aiguille -->
      <linearGradient id="pg-needle" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#cc1010"/>
        <stop offset="50%"  stop-color="#ff3b3b"/>
        <stop offset="100%" stop-color="#cc1010"/>
      </linearGradient>
      <!-- Reflet verre -->
      <radialGradient id="pg-glass" cx="35%" cy="30%" r="55%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>

      <filter id="pg-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ═══ BISEAU EXTÉRIEUR ═══ -->
    <circle cx="65" cy="72" r="58"
            fill="url(#pg-bezel)" stroke="#000" stroke-width="1"/>
    <!-- Ring intérieur chromé -->
    <circle cx="65" cy="72" r="55"
            fill="none" stroke="#777" stroke-width="1.5"/>
    <circle cx="65" cy="72" r="53"
            fill="none" stroke="#333" stroke-width="0.5"/>

    <!-- ═══ FACE DU CADRAN ═══ -->
    <circle cx="65" cy="72" r="52" fill="url(#pg-face)"/>

    <!-- ═══ ARC DE FOND (rail des graduations) ═══ -->
    <!-- Arc grisé complet 240° -->
    <path d="M 25.6 101.0 A 46 46 0 1 1 104.4 101.0"
          fill="none" stroke="#2a3040" stroke-width="5"
          stroke-linecap="round"/>

    <!-- ═══ ARC DE REMPLISSAGE (scroll progress) ═══ -->
    <path #arcFillEl
          d="M 25.6 101.0"
          fill="none" stroke="url(#pg-needle)" stroke-width="4"
          stroke-linecap="round"
          filter="url(#pg-glow-filter)"/>

    <!-- ═══ GRADUATIONS ═══ -->
    <!-- 13 grands traits (tous les 20°) + 24 petits (tous les 10°) -->
    <!-- Trait à -120° (0) -->
    <line x1="25.1" y1="97.5" x2="29.2" y2="91.2" stroke="#667" stroke-width="1.2"/>
    <!-- Trait à -100° -->
    <line x1="31.0" y1="117.5" x2="34.0" y2="110.8" stroke="#445" stroke-width="0.7"/>
    <!-- Trait à -80° -->
    <line x1="20.5" y1="83.8"  x2="25.5" y2="82.0"  stroke="#445" stroke-width="0.7"/>
    <!-- Trait à -60° (25) -->
    <line x1="19.0" y1="56.0"  x2="24.5" y2="57.5"  stroke="#667" stroke-width="1.2"/>
    <!-- Trait à -40° -->
    <line x1="28.5" y1="33.5"  x2="32.5" y2="38.2"  stroke="#445" stroke-width="0.7"/>
    <!-- Trait à -20° -->
    <line x1="45.0" y1="18.5"  x2="47.5" y2="24.0"  stroke="#445" stroke-width="0.7"/>
    <!-- Trait à 0° (50) -->
    <line x1="65.0" y1="20.0"  x2="65.0" y2="26.5"  stroke="#889" stroke-width="1.4"/>
    <!-- Trait à +20° -->
    <line x1="85.0" y1="18.5"  x2="82.5" y2="24.0"  stroke="#445" stroke-width="0.7"/>
    <!-- Trait à +40° -->
    <line x1="101.5" y1="33.5" x2="97.5" y2="38.2"  stroke="#445" stroke-width="0.7"/>
    <!-- Trait à +60° (75) -->
    <line x1="111.0" y1="56.0" x2="105.5" y2="57.5" stroke="#667" stroke-width="1.2"/>
    <!-- Trait à +80° -->
    <line x1="109.5" y1="83.8" x2="104.5" y2="82.0" stroke="#445" stroke-width="0.7"/>
    <!-- Trait à +100° -->
    <line x1="99.0" y1="117.5" x2="96.0" y2="110.8" stroke="#445" stroke-width="0.7"/>
    <!-- Trait à +120° (100) -->
    <line x1="104.9" y1="97.5" x2="100.8" y2="91.2" stroke="#667" stroke-width="1.2"/>

    <!-- ═══ CHIFFRES (fonte vintage) ═══ -->
    <text x="20"  y="96"  class="gauge-num">0</text>
    <text x="14"  y="58"  class="gauge-num">25</text>
    <text x="58"  y="17"  class="gauge-num">50</text>
    <text x="96"  y="58"  class="gauge-num">75</text>
    <text x="103" y="96"  class="gauge-num">100</text>

    <!-- ═══ LABEL "PRESSION" ═══ -->
    <text x="65" y="52" class="gauge-label">PRESSION</text>

    <!-- ═══ HALO GLOW sous l'aiguille ═══ -->
    <circle #glowEl cx="65" cy="72" r="28" fill="rgb(20,200,20)" opacity="0.12"/>

    <!-- ═══ AIGUILLE ═══ -->
    <g #needleEl transform="rotate(-120, 65, 72)">
      <!-- Corps de l'aiguille -->
      <polygon points="65,30 63.5,70 65,74 66.5,70"
               fill="url(#pg-needle)" filter="url(#pg-glow-filter)"/>
      <!-- Contrepoids de l'aiguille -->
      <ellipse cx="65" cy="78" rx="3.5" ry="5" fill="#cc2020"/>
    </g>

    <!-- ═══ PIVOT CENTRAL ═══ -->
    <circle cx="65" cy="72" r="5" fill="#222" stroke="#888" stroke-width="1"/>
    <circle cx="65" cy="72" r="2.5" fill="#ff4040"/>
    <circle cx="65" cy="72" r="1"   fill="#fff" opacity="0.6"/>

    <!-- ═══ REFLET VERRE ═══ -->
    <circle cx="65" cy="72" r="52" fill="url(#pg-glass)"/>

    <!-- ═══ LABEL POURCENTAGE ═══ -->
    <text #labelEl x="65" y="95" class="gauge-pct">0</text>

    <!-- ═══ UNITÉ ═══ -->
    <text x="65" y="104" class="gauge-unit">%</text>
  </svg>

  <!-- Badge "OIL PRESS" -->
  <div class="gauge-badge">OIL PRESS</div>
</div>

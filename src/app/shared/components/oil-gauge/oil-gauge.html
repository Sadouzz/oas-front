<div class="oil-gauge-wrapper">
  <!-- Libellé de la jauge -->
  <span class="oil-gauge-label">OIL LEVEL</span>

  <div class="oil-tube-outer">
    <!-- Graduation marks -->
    <div class="oil-marks">
      <span class="mark-max">MAX</span>
      <span class="mark-mid">—</span>
      <span class="mark-min">MIN</span>
    </div>

    <!-- Le tube en verre avec le fluide -->
    <div class="oil-glass-tube">
      <!-- Le fluide (huile ambrée/miel) -->
      <div #oilFillEl class="oil-fill">
        <!-- Effet de vagues de chaleur/fluide -->
        <div class="oil-wave"></div>
        <!-- Petites bulles d'air montantes -->
        <div class="oil-bubbles">
          <div class="bubble"></div>
          <div class="bubble"></div>
          <div class="bubble"></div>
        </div>
      </div>
      <!-- Reflet brillant du verre -->
      <div class="glass-glare"></div>
    </div>
  </div>
</div>

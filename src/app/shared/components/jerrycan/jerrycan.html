<div class="jerrycan-wrapper" [style.width.px]="size" [style.height.px]="size" [style.opacity]="opacity">
  <div class="jerrycan-tilted" [style.transform]="'rotate(' + tiltAngle + 'deg)'">
    <svg viewBox="0 0 200 260" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- Corps principal du Jerrycan (rempli en semi-transparent pour donner de la masse) -->
        <path d="M 30,80 
                 L 30,230 
                 A 12,12 0 0 0 42,242 
                 L 158,242 
                 A 12,12 0 0 0 170,230 
                 L 170,80 
                 A 12,12 0 0 0 158,68 
                 L 75,68 
                 L 50,78 
                 A 12,12 0 0 0 40,88 
                 Z" 
              fill="currentColor" fill-opacity="0.15" stroke-width="6" />

        <!-- Goulot & Bouchon métallique incliné à gauche -->
        <path d="M 45,73 L 34,60 L 51,50 L 61,63 Z" fill="currentColor" fill-opacity="0.35" stroke-width="4" />
        <path d="M 31,56 L 54,46" stroke-width="6" />
        <circle cx="34" cy="60" r="3" fill="currentColor" />

        <!-- Poignée gauche -->
        <path d="M 72,66 L 72,25 A 6,6 0 0 1 78,19 L 88,19 A 6,6 0 0 1 94,25 L 94,66" stroke-width="4" fill="currentColor" fill-opacity="0.1" />
        <!-- Poignée centrale -->
        <path d="M 100,66 L 100,20 A 6,6 0 0 1 106,14 L 116,14 A 6,6 0 0 1 122,20 L 122,66" stroke-width="5" fill="currentColor" fill-opacity="0.1" />
        <!-- Poignée droite -->
        <path d="M 128,66 L 128,25 A 6,6 0 0 1 134,19 L 144,19 A 6,6 0 0 1 150,25 L 150,66" stroke-width="4" fill="currentColor" fill-opacity="0.1" />

        <!-- Nervures de renfort en X typiques -->
        <path d="M 52,100 L 148,210" stroke-width="5" opacity="0.85" />
        <path d="M 148,100 L 52,210" stroke-width="5" opacity="0.85" />
        
        <!-- Cadre de renfort embouti rectangulaire -->
        <rect x="46" y="92" width="108" height="126" rx="8" stroke-width="3.5" opacity="0.5" />

        <!-- Plaque d'homologation / Emboutissage central -->
        <rect x="75" y="135" width="50" height="40" rx="4" stroke-width="2.5" fill="currentColor" fill-opacity="0.2" opacity="0.75" />
        <line x1="85" y1="147" x2="115" y2="147" stroke-width="2.5" opacity="0.6" />
        <line x1="85" y1="155" x2="115" y2="155" stroke-width="2.5" opacity="0.6" />
        <line x1="85" y1="163" x2="105" y2="163" stroke-width="2.5" opacity="0.6" />
      </g>
    </svg>
  </div>
</div>

<div>
  @if (previewUrl && !uploading) {
    <div class="relative rounded-xl border border-oas-line overflow-hidden bg-oas-bg group">
      @if (isVideo) {
        <video [src]="previewUrl" class="w-full h-40 object-cover" muted></video>
      } @else {
        <img [src]="previewUrl" class="w-full h-40 object-cover" alt="Aperçu" />
      }
      <button type="button" (click)="clear()"
        class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 hover:bg-black/80 text-white flex items-center justify-center transition cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  } @else {
    <label
      class="flex flex-col items-center justify-center gap-2 h-40 rounded-xl border-2 border-dashed cursor-pointer transition text-center px-4"
      [class.border-oas-accent]="dragOver"
      [class.bg-oas-accent-bg]="dragOver"
      [class.border-oas-line]="!dragOver"
      [class.bg-oas-bg]="!dragOver"
      (drop)="onDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave()">

      @if (uploading) {
        <svg class="animate-spin h-6 w-6 text-oas-accent" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <p class="text-xs font-semibold text-oas-ink">Envoi en cours… {{ progress }}%</p>
        <div class="w-full max-w-[160px] h-1.5 rounded-full bg-oas-line overflow-hidden">
          <div class="h-full bg-oas-accent transition-all" [style.width.%]="progress"></div>
        </div>
      } @else {
        <svg class="w-6 h-6 text-oas-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
        </svg>
        <p class="text-xs font-semibold text-oas-ink2">{{ label }}</p>
        <p class="text-[11px] text-oas-muted">Image ou vidéo</p>
      }

      <input type="file" [accept]="accept" (change)="onFileSelected($event)" [disabled]="uploading" class="hidden" />
    </label>
  }

  @if (errorMessage) {
    <p class="text-oas-bad text-xs mt-1.5">{{ errorMessage }}</p>
  }
</div>

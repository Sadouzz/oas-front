<div
  class="gears-container"
  [style.opacity]="opacity"
  [style.width.px]="size"
  [style.height.px]="size"
  aria-hidden="true">
  
  <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" class="gears-svg">
    <!-- LARGE GEAR (Grand Engrenage Principal) -->
    <g transform="translate(160, 200)">
      <!-- Scroll rotation wrapper -->
      <g [style.transform]="'rotate(' + scrollAngle + 'deg)'" class="scroll-gear-wrapper">
        <!-- Idle continuous spin wrapper -->
        <g class="gear-spin-main">
          <!-- 12 Teeth Symmetric Involute Gear Body -->
          <path
            d="M 83.77 -14.39 L 109.54 -10.07 L 109.54 10.07 L 83.77 14.39 L 79.75 29.42 L 99.90 46.05 L 89.83 63.49 L 65.35 54.35 L 54.35 65.35 L 63.49 89.83 L 46.05 99.90 L 29.42 79.75 L 14.39 83.77 L 10.07 109.54 L -10.07 109.54 L -14.39 83.77 L -29.42 79.75 L -46.05 99.90 L -63.49 89.83 L -54.35 65.35 L -65.35 54.35 L -89.83 63.49 L -99.90 46.05 L -79.75 29.42 L -83.77 14.39 L -109.54 10.07 L -109.54 -10.07 L -83.77 -14.39 L -79.75 -29.42 L -99.90 -46.05 L -89.83 -63.49 L -65.35 -54.35 L -54.35 -65.35 L -63.49 -89.83 L -46.05 -99.90 L -29.42 -79.75 L -14.39 -83.77 L -10.07 -109.54 L 10.07 -109.54 L 14.39 -83.77 L 29.42 -79.75 L 46.05 -99.90 L 63.49 -89.83 L 54.35 -65.35 L 65.35 -54.35 L 89.83 -63.49 L 99.90 -46.05 L 79.75 -29.42 Z"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <!-- Pitch & Root Rings -->
          <circle r="97" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="8 6" />
          <circle r="65" fill="none" stroke="#ffffff" stroke-width="2" />
          <circle r="30" fill="none" stroke="#ffffff" stroke-width="2" />
          <circle r="12" fill="#ffffff" />

          <!-- 6 Weight Reduction Voids -->
          <circle cx="0" cy="-48" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="41.5" cy="-24" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="41.5" cy="24" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="0" cy="48" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="-41.5" cy="24" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="-41.5" cy="-24" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" />
        </g>
      </g>
    </g>

    <!-- SECONDARY SMALL GEAR (Engrenage Secondaire) -->
    <g transform="translate(315, 110)">
      <!-- Scroll rotation wrapper (inverse 1.5x) -->
      <g [style.transform]="'rotate(' + (-scrollAngle * 1.5) + 'deg)'" class="scroll-gear-wrapper">
        <!-- Idle continuous spin wrapper -->
        <g class="gear-spin-secondary">
          <!-- 8 Teeth Symmetric Involute Gear Body -->
          <path
            d="M 48.38 -12.62 L 71.32 -9.86 L 71.32 9.86 L 48.38 12.62 L 43.14 25.28 L 57.41 43.46 L 43.46 57.41 L 25.28 43.14 L 12.62 48.38 L 9.86 71.32 L -9.86 71.32 L -12.62 48.38 L -25.28 43.14 L -43.46 57.41 L -57.41 43.46 L -43.14 25.28 L -48.38 12.62 L -71.32 9.86 L -71.32 -9.86 L -48.38 -12.62 L -43.14 -25.28 L -57.41 -43.46 L -43.46 -57.41 L -25.28 -43.14 L -12.62 -48.38 L -9.86 -71.32 L 9.86 -71.32 L 12.62 -48.38 L 25.28 -43.14 L 43.46 -57.41 L 57.41 -43.46 L 43.14 -25.28 Z"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <!-- Pitch Ring & Inner Hub -->
          <circle r="60" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="6 4" />
          <circle r="32" fill="none" stroke="#ffffff" stroke-width="2" />
          <circle r="8" fill="#ffffff" />

          <!-- 4 Spoke Voids -->
          <circle cx="0" cy="-20" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="20" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="0" cy="20" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" />
          <circle cx="-20" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" />
        </g>
      </g>
    </g>
  </svg>
</div>

<div class="dashboard-cluster-panel" aria-label="Sélecteur par voyants de tableau de bord">
  <div class="cluster-header">
    <div class="header-indicator">
      <span class="pulse-dot"></span>
      <span class="header-title">IDENTIFIEZ VOTRE BESOIN PAR VOYANT</span>
    </div>
    <span class="header-subtitle">Cliquez ou survolez un voyant pour cibler l'intervention</span>
  </div>

  <div class="cluster-grid">
    <button
      *ngFor="let item of warnings"
      type="button"
      class="warning-btn"
      [class.active]="activeIndex === item.index"
      (click)="selectWarning(item)"
      [attr.aria-label]="item.label">
      
      <!-- Icon Container -->
      <div class="icon-wrap">
        <!-- SVG 1: Mécanique (Engine) -->
        <svg *ngIf="item.id === 'mecanique'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <path d="M4 10h2V7h4V4h4v3h4v3h2v4h-2v3h-3v3h-6v-3H6v-3H4v-4z" />
          <path d="M9 11h6" />
          <circle cx="12" cy="14" r="1" fill="currentColor" />
        </svg>

        <!-- SVG 2: Électricité (Battery) -->
        <svg *ngIf="item.id === 'electricite'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <rect x="3" y="6" width="18" height="14" rx="0" />
          <path d="M7 4v2M17 4v2" stroke-width="2.5" />
          <path d="M6.5 11h3M8 9.5v3M14.5 11h3" />
        </svg>

        <!-- SVG 3: Vidange (Oil Can) -->
        <svg *ngIf="item.id === 'vidange'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <path d="M3 13l3-6h10l3 3v5a3 3 0 01-3 3H6a3 3 0 01-3-3v-2z" />
          <path d="M19 10l3-2M3 14H1" />
          <circle cx="17" cy="17" r="1.5" fill="currentColor" />
        </svg>

        <!-- SVG 4: Climatisation (AC Snowflake) -->
        <svg *ngIf="item.id === 'climatisation'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <line x1="12" y1="2" x2="12" y2="22" />
          <line x1="3.5" y1="7" x2="20.5" y2="17" />
          <line x1="3.5" y1="17" x2="20.5" y2="7" />
          <path d="M10 4l2 2 2-2M10 20l2-2 2 2M5 9l3 1-1 3M19 9l-3 1 1 3" />
        </svg>

        <!-- SVG 5: Tôlerie (Bodywork) -->
        <svg *ngIf="item.id === 'tolerie'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <path d="M3 14l3-5h12l3 5v4H3v-4z" />
          <circle cx="7" cy="18" r="2" />
          <circle cx="17" cy="18" r="2" />
          <path d="M12 5l-1 3 3-1-2 3" stroke-linecap="round" />
        </svg>

        <!-- SVG 6: Peinture (Spray or similar icon) -->
        <svg *ngIf="item.id === 'peinture'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <path d="M8 8V5c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v3" />
          <path d="M7 8h10c.6 0 1 .4 1 1v12c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9c0-.6.4-1 1-1z" />
          <circle cx="12" cy="15" r="2" />
          <path d="M12 5v3" />
          <path d="M4 14h2" />
          <path d="M5 12l1 1" />
          <path d="M5 16l1-1" />
        </svg>
      </div>

      <span class="warning-label">{{ item.shortLabel }}</span>
    </button>
  </div>
</div>

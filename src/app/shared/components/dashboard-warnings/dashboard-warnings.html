<div class="dashboard-cluster-panel" aria-label="Sélecteur par voyants de tableau de bord">
  <div class="cluster-header">
    <div class="header-indicator">
      <span class="pulse-dot"></span>
      <span class="header-title">IDENTIFIEZ VOTRE BESOIN PAR VOYANT</span>
    </div>
    <span class="header-subtitle">Cliquez ou survolez un voyant pour cibler l'intervention</span>
  </div>

  <div class="cluster-grid">
    <button
      *ngFor="let item of warnings"
      type="button"
      class="warning-btn"
      [class.active]="activeIndex === item.index"
      (click)="selectWarning(item)"
      [attr.aria-label]="item.label">
      
      <!-- Icon Container -->
      <div class="icon-wrap">
        <!-- SVG 1: Engine Check (Voyant Moteur) -->
        <svg *ngIf="item.id === 'engine'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <path d="M4 10h2V7h4V4h4v3h4v3h2v4h-2v3h-3v3h-6v-3H6v-3H4v-4z" />
          <path d="M9 11h6" />
          <circle cx="12" cy="14" r="1" fill="currentColor" />
        </svg>

        <!-- SVG 2: Diagnostic Scan -->
        <svg *ngIf="item.id === 'diag'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <rect x="5" y="3" width="14" height="18" rx="0" />
          <path d="M9 7h6M9 11h6M9 15h4" />
          <path d="M12 21v2" />
        </svg>

        <!-- SVG 3: Oil Can (Pression d'Huile) -->
        <svg *ngIf="item.id === 'oil'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <path d="M3 13l3-6h10l3 3v5a3 3 0 01-3 3H6a3 3 0 01-3-3v-2z" />
          <path d="M19 10l3-2M3 14H1" />
          <circle cx="17" cy="17" r="1.5" fill="currentColor" />
        </svg>

        <!-- SVG 4: Brake Warning (Freins) -->
        <svg *ngIf="item.id === 'brakes'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <circle cx="12" cy="12" r="6" />
          <path d="M12 9v4M12 16.5v.5" stroke-width="2.2" />
          <path d="M4.5 7.5A9.5 9.5 0 004.5 16.5M19.5 7.5a9.5 9.5 0 010 9" />
        </svg>

        <!-- SVG 5: AC Snowflake (Climatisation) -->
        <svg *ngIf="item.id === 'ac'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <line x1="12" y1="2" x2="12" y2="22" />
          <line x1="3.5" y1="7" x2="20.5" y2="17" />
          <line x1="3.5" y1="17" x2="20.5" y2="7" />
          <path d="M10 4l2 2 2-2M10 20l2-2 2 2M5 9l3 1-1 3M19 9l-3 1 1 3" />
        </svg>

        <!-- SVG 6: Battery (Batterie) -->
        <svg *ngIf="item.id === 'battery'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <rect x="3" y="6" width="18" height="14" rx="0" />
          <path d="M7 4v2M17 4v2" stroke-width="2.5" />
          <path d="M6.5 11h3M8 9.5v3M14.5 11h3" />
        </svg>

        <!-- SVG 7: Bodywork / Collision (Carrosserie) -->
        <svg *ngIf="item.id === 'bodywork'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <path d="M3 14l3-5h12l3 5v4H3v-4z" />
          <circle cx="7" cy="18" r="2" />
          <circle cx="17" cy="18" r="2" />
          <path d="M12 5l-1 3 3-1-2 3" stroke-linecap="round" />
        </svg>

        <!-- SVG 8: TPMS Tire Pressure (Pneus) -->
        <svg *ngIf="item.id === 'tpms'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <path d="M4 8.5C4 16 6 19 12 19s8-3 8-10.5" />
          <path d="M12 9v4M12 15.5v.5" stroke-width="2.2" />
          <path d="M6 5.5h12M8 3.5v2M12 3.5v2M16 3.5v2" />
        </svg>

        <!-- SVG 9: Towing SOS (Remorquage) -->
        <svg *ngIf="item.id === 'towing'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="warning-svg">
          <path d="M2 17h14v-4H9L7 9H2v8z" />
          <circle cx="5" cy="17" r="2" />
          <path d="M16 13l4-4h2v8h-3" />
          <circle cx="19" cy="17" r="2" />
        </svg>
      </div>

      <span class="warning-label">{{ item.shortLabel }}</span>
    </button>
  </div>
</div>

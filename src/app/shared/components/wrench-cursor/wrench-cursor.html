<div #cursorEl class="wrench-cursor">
  
  <svg 
    xmlns="http://www.w3.org/2000/svg" 
    viewBox="0 0 28 90"
    class="wrench-svg"
    fill="none">

    <defs>
      <filter id="c14-shadow" x="-40%" y="-10%" width="200%" height="120%">
        <feDropShadow dx="1" dy="2" stdDeviation="1.8" flood-color="#000" flood-opacity="0.6" />
      </filter>
      <!-- Gradient métal brossé horizontal -->
      <linearGradient id="c14-metal" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#5a5a5a"/>
        <stop offset="20%"  stop-color="#b0b0b0"/>
        <stop offset="42%"  stop-color="#e8e8e8"/>
        <stop offset="58%"  stop-color="#f5f5f5"/>
        <stop offset="78%"  stop-color="#b8b8b8"/>
        <stop offset="100%" stop-color="#5a5a5a"/>
      </linearGradient>
      <!-- Gradient légèrement plus chaud pour la tête -->
      <linearGradient id="c14-head" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#606060"/>
        <stop offset="25%"  stop-color="#c4c4c4"/>
        <stop offset="50%"  stop-color="#ececec"/>
        <stop offset="75%"  stop-color="#c0c0c0"/>
        <stop offset="100%" stop-color="#606060"/>
      </linearGradient>
    </defs>

    <g filter="url(#c14-shadow)">

      <!-- ════════════════════════
           FOURCHE EN U (tête haute)
           ════════════════════════ -->
      <!-- Joue gauche de la fourche -->
      <rect x="2" y="0" width="7" height="20" rx="1"
            fill="url(#c14-head)" stroke="#3a3a3a" stroke-width="0.6"/>
      <!-- Joue droite de la fourche -->
      <rect x="19" y="0" width="7" height="20" rx="1"
            fill="url(#c14-head)" stroke="#3a3a3a" stroke-width="0.6"/>
      <!-- Base de la fourche (pont entre les deux joues) -->
      <rect x="2" y="16" width="24" height="7" rx="1"
            fill="url(#c14-head)" stroke="#3a3a3a" stroke-width="0.6"/>

      <!-- Chanfreins d'entrée des joues (arêtes internes biseautées) -->
      <line x1="9" y1="0"  x2="9"  y2="16" stroke="#888" stroke-width="0.4" opacity="0.5"/>
      <line x1="19" y1="0" x2="19" y2="16" stroke="#888" stroke-width="0.4" opacity="0.5"/>

      <!-- Reflet interne de la fourche -->
      <line x1="14" y1="1" x2="14" y2="14" stroke="#fff" stroke-width="0.5" opacity="0.15"/>

      <!-- ════════════════════════
           MANCHE (tige centrale)
           ════════════════════════ -->
      <rect x="8" y="22" width="12" height="46" rx="1.5"
            fill="url(#c14-metal)" stroke="#3a3a3a" stroke-width="0.6"/>

      <!-- Reflet longitudinal sur le manche -->
      <line x1="13.5" y1="23" x2="13.5" y2="67" stroke="#fff" stroke-width="0.7" opacity="0.2"/>

      <!-- Gravure "14" sur le manche -->
      <text x="14" y="50"
            font-family="'Arial Narrow', Arial, sans-serif"
            font-size="5"
            font-weight="bold"
            fill="#3a3a3a"
            text-anchor="middle"
            letter-spacing="0.3"
            opacity="0.6">14</text>

      <!-- ════════════════════════
           ANNEAU HEXAGONAL (tête basse)
           ════════════════════════ -->
      <!-- Corps de l'anneau -->
      <circle cx="14" cy="78" r="11"
              fill="url(#c14-head)" stroke="#3a3a3a" stroke-width="0.7"/>
      <!-- Bord intérieur de l'anneau -->
      <circle cx="14" cy="78" r="7.5"
              fill="#1a1a1a" stroke="#444" stroke-width="0.5"/>
      <!-- Hexagone intérieur (profil de l'écrou 14mm) -->
      <polygon points="14,71.5 19.5,74.7 19.5,81.3 14,84.5 8.5,81.3 8.5,74.7"
               fill="none" stroke="#888" stroke-width="0.8"/>
      <!-- Reflet sur l'anneau -->
      <path d="M 8 73 Q 14 70 20 73" stroke="#fff" stroke-width="0.7" opacity="0.2" fill="none"/>

      <!-- Jonction manche → anneau -->
      <rect x="8" y="66" width="12" height="5" rx="0"
            fill="url(#c14-metal)" stroke="#3a3a3a" stroke-width="0.6"/>
    </g>
  </svg>
</div>

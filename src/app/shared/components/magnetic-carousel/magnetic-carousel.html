<div
  #container
  class="relative flex items-center justify-start overflow-x-auto overflow-y-hidden w-full h-full px-12 py-12 hide-scrollbar"
  [style.gap.px]="gap"
>
  <!-- Transparent backdrop — click to close when a bar is open. -->
  <div
    class="fixed inset-0 z-[1]"
    [style.pointerEvents]="openIndex !== null ? 'auto' : 'none'"
    (click)="closeCarousel()"
  ></div>

  @for (img of repeatedItems; track img.id + '_' + i; let i = $index) {
    @let sizes = sizeFor(i);
    @let blurred = openIndex !== null && i !== openIndex;
    
    <div
      class="flex-none overflow-hidden relative transition-all duration-300"
      [style.width.px]="sizes.width"
      [style.height.px]="sizes.height"
      [style.transition]="getTransitionStyle()"
      [style.willChange]="'width, height'"
      [style.zIndex]="openIndex === i ? 3 : 2"
      [style.filter]="blurred ? 'blur(' + blurAmount + 'px)' : 'none'"
      [style.opacity]="blurred ? 0.6 : 1"
      [style.backgroundColor]="img.src ? 'transparent' : 'hsl(' + ((i * 360) / repeatedItems.length) + ', 70%, 58%)'"
      [style.backgroundImage]="img.src ? 'url(' + img.src + ')' : 'none'"
      [style.backgroundSize]="'cover'"
      [style.backgroundPosition]="'center'"
      [style.backgroundRepeat]="'no-repeat'"
      (click)="onItemClick($event, i)"
      [style.cursor]="openIndex === i ? 'default' : 'pointer'"
    >
      <!-- Vis cruciformes aux 4 coins de chaque item -->
      <app-bolt-corners variant="light" [size]="11" [offset]="6"></app-bolt-corners>

      <!-- Titre affiché directement, bien lisible et à l'horizontale -->
      @if (img.title) {
        <div 
           class="absolute inset-x-0 bottom-0 px-4 py-4 sm:py-5 bg-gradient-to-t from-black/95 via-black/70 to-transparent flex flex-col justify-end items-center pointer-events-none transition-all duration-300"
        >
           <span class="text-white uppercase font-extrabold text-sm sm:text-base md:text-lg tracking-wider text-center drop-shadow-md leading-tight">
             {{ img.title }}
           </span>
           <div class="h-1 bg-oas-accent w-10 mt-1.5 rounded-full transition-all duration-300"></div>
        </div>
      }
    </div>
  }
</div>

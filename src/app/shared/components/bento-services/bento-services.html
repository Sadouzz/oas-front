<section class="w-full py-32 px-6 lg:px-12 bg-[#f5f5f7] text-gray-900">
  <div class="max-w-[1400px] mx-auto">
    
    <div class="mb-16">
      <app-section-title 
        align="left"
        theme="light"
        mainTitle="NOTRE EXPERTISE." 
        highlightedText="(Bento)" 
        subtitle="Style 03">
      </app-section-title>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 md:gap-6 auto-rows-[250px]">
      @for (item of items; track item.id; let i = $index) {
        <a [routerLink]="['/services', item.slug]" 
           class="relative overflow-hidden group shadow-sm hover:shadow-xl transition-shadow duration-500 bg-black cursor-pointer block"
           [ngClass]="getBentoClass(i)">
          
          <!-- Background Image with Zoom on Hover -->
          <img [src]="item.src" alt="{{ item.title }}" 
               class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 ease-[cubic-bezier(0.25,1,0.5,1)] group-hover:scale-110 opacity-90" />
          
          <!-- Gradient Overlay -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent transition-opacity duration-500 group-hover:opacity-80"></div>
          
          <!-- Content -->
          <div class="absolute inset-x-0 bottom-0 p-6 md:p-8 text-white flex flex-col justify-end h-full">
             <!-- Icon -->
             <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center mb-4 text-white transform origin-left transition-all duration-300 group-hover:scale-110 group-hover:bg-oas-accent group-hover:text-black">
               <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
             </div>
             
             <!-- Title -->
             <h4 class="text-2xl md:text-3xl font-bold tracking-tight leading-tight mb-2">{{ item.title }}</h4>
             
             <!-- Description (Revealed on hover) -->
             <div class="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-all duration-500 ease-in-out">
               <p class="overflow-hidden text-gray-300 text-sm md:text-base font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-100">
                 {{ item.description }}
               </p>
             </div>
          </div>
        </a>
      }
    </div>
  </div>
</section>

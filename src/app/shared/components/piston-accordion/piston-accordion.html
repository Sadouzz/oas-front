<div class="piston-accordion-container" [class.is-active]="active">
  <!-- En-tête de l'accordéon -->
  <button 
    type="button" 
    (click)="onHeaderClick()" 
    class="accordion-header flex justify-between items-center w-full py-5 px-6 border-b border-oas-line text-left transition-colors duration-300"
    [attr.aria-expanded]="active"
  >
    <div class="flex flex-col">
      <span class="text-oas-accent font-black tracking-[0.2em] text-xs uppercase mb-1">{{ subtitle }}</span>
      <h3 class="text-xl font-sans font-black uppercase text-oas-navy-dark transition-colors duration-300 group-hover:text-oas-accent">{{ title }}</h3>
    </div>
    <!-- Symbole plus/moins mécanique (clé à molette pivotante ou simple écrou qui tourne!) -->
    <div class="toggle-icon-container">
      <svg class="toggle-icon w-6 h-6 fill-current text-oas-accent transition-transform duration-500" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <!-- Une clé à molette croisée ou un axe pivotant -->
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
      </svg>
    </div>
  </button>

  <!-- Panneau de contenu rétractable -->
  <div class="accordion-body-wrapper relative overflow-hidden transition-all duration-500 ease-in-out">
    
    <!-- Amortisseur Gauche -->
    <div class="shock-absorber left-shock">
      <svg viewBox="0 0 40 180" class="shock-svg">
        <!-- Chape supérieure (fixe) -->
        <circle cx="20" cy="15" r="8" fill="none" stroke="#2c3e50" stroke-width="3" />
        <circle cx="20" cy="15" r="3" fill="#2c3e50" />
        <rect x="16" y="23" width="8" height="12" fill="#7f8c8d" />
        
        <!-- Coupelle supérieure d'appui du ressort (fixe) -->
        <rect x="6" y="35" width="28" height="6" fill="#34495e" rx="1" />
        
        <!-- Tige de piston (Fixe) -->
        <line x1="20" y1="41" x2="20" y2="130" stroke="#bdc3c7" stroke-width="4" stroke-linecap="round" />

        <!-- Ressort Hélicoïdal (Animé en étirement vertical scaleY) -->
        <path class="coil-spring" d="M20 41 L10 52 L30 63 L10 74 L30 85 L10 96 L30 107 L10 118 L30 129 L20 140" 
              fill="none" stroke="var(--color-oas-accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />

        <!-- Corps du vérin d'amortisseur (Animé en translation vers le bas) -->
        <g class="shock-body">
          <!-- Coupelle inférieure d'appui (mobile) -->
          <rect x="8" y="125" width="24" height="6" fill="#34495e" rx="1" />
          <!-- Cylindre principal -->
          <rect x="12" y="131" width="16" height="40" fill="#2c3e50" rx="1" />
          <!-- Chape inférieure -->
          <circle cx="20" cy="171" r="8" fill="none" stroke="#2c3e50" stroke-width="3" />
          <circle cx="20" cy="171" r="3" fill="#2c3e50" />
        </g>
      </svg>
    </div>

    <!-- Contenu central textuel -->
    <div class="accordion-content-text px-16 py-8">
      <ng-content></ng-content>
    </div>

    <!-- Amortisseur Droit -->
    <div class="shock-absorber right-shock">
      <svg viewBox="0 0 40 180" class="shock-svg">
        <!-- Chape supérieure (fixe) -->
        <circle cx="20" cy="15" r="8" fill="none" stroke="#2c3e50" stroke-width="3" />
        <circle cx="20" cy="15" r="3" fill="#2c3e50" />
        <rect x="16" y="23" width="8" height="12" fill="#7f8c8d" />
        
        <!-- Coupelle supérieure d'appui du ressort (fixe) -->
        <rect x="6" y="35" width="28" height="6" fill="#34495e" rx="1" />
        
        <!-- Tige de piston (Fixe) -->
        <line x1="20" y1="41" x2="20" y2="130" stroke="#bdc3c7" stroke-width="4" stroke-linecap="round" />

        <!-- Ressort Hélicoïdal (Animé en étirement vertical scaleY) -->
        <path class="coil-spring" d="M20 41 L10 52 L30 63 L10 74 L30 85 L10 96 L30 107 L10 118 L30 129 L20 140" 
              fill="none" stroke="var(--color-oas-accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />

        <!-- Corps du vérin d'amortisseur (Animé en translation vers le bas) -->
        <g class="shock-body">
          <!-- Coupelle inférieure d'appui (mobile) -->
          <rect x="8" y="125" width="24" height="6" fill="#34495e" rx="1" />
          <!-- Cylindre principal -->
          <rect x="12" y="131" width="16" height="40" fill="#2c3e50" rx="1" />
          <!-- Chape inférieure -->
          <circle cx="20" cy="171" r="8" fill="none" stroke="#2c3e50" stroke-width="3" />
          <circle cx="20" cy="171" r="3" fill="#2c3e50" />
        </g>
      </svg>
    </div>

  </div>
</div>

<div class="loader-overlay" [class.active]="isLoading" aria-hidden="true">
  <div class="loader-content">
    <!-- Spinning Hexagonal Bolt / Nut -->
    <div class="bolt-spinner">
      <svg
        viewBox="0 0 100 100"
        class="bolt-svg"
        xmlns="http://www.w3.org/2000/svg"
        fill="none">
        
        <defs>
          <!-- Metal Gradients -->
          <linearGradient id="boltMetal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4a4a4a" />
            <stop offset="25%" stop-color="#b8b8b8" />
            <stop offset="50%" stop-color="#f5f5f5" />
            <stop offset="75%" stop-color="#8c8c8c" />
            <stop offset="100%" stop-color="#383838" />
          </linearGradient>
          
          <linearGradient id="innerThread" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#111111" />
            <stop offset="50%" stop-color="#444444" />
            <stop offset="100%" stop-color="#222222" />
          </linearGradient>
          
          <radialGradient id="holeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ef1a1a" stop-opacity="0.6" />
            <stop offset="80%" stop-color="#ef1a1a" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#ef1a1a" stop-opacity="0" />
          </radialGradient>

          <!-- 3D Shadow -->
          <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
          </filter>
        </defs>

        <!-- Red center glow behind the bolt -->
        <circle cx="50" cy="50" r="30" fill="url(#holeGlow)" />

        <g filter="url(#boltShadow)">
          <!-- Main Hexagonal Nut Body -->
          <path
            d="M 90 50 
               L 70 84.64 
               L 30 84.64 
               L 10 50 
               L 30 15.36 
               L 70 15.36 
               Z"
            fill="url(#boltMetal)"
            stroke="#222222"
            stroke-width="1.5"
            stroke-linejoin="round"
          />

          <!-- 3D Facet Lines from Hexagon Corners -->
          <line x1="90" y1="50" x2="74" y2="50" stroke="#333" stroke-width="1" opacity="0.6" />
          <line x1="70" y1="84.64" x2="60" y2="70.5" stroke="#333" stroke-width="1" opacity="0.6" />
          <line x1="30" y1="84.64" x2="40" y2="70.5" stroke="#333" stroke-width="1" opacity="0.6" />
          <line x1="10" y1="50" x2="26" y2="50" stroke="#333" stroke-width="1" opacity="0.6" />
          <line x1="30" y1="15.36" x2="40" y2="29.5" stroke="#333" stroke-width="1" opacity="0.6" />
          <line x1="70" y1="15.36" x2="60" y2="29.5" stroke="#333" stroke-width="1" opacity="0.6" />

          <!-- Circular Inner Bevel Outer Ring -->
          <circle cx="50" cy="50" r="24" fill="none" stroke="#222222" stroke-width="1.5" />
          
          <!-- Nut Thread Hole -->
          <circle cx="50" cy="50" r="20" fill="url(#innerThread)" stroke="#111111" stroke-width="1" />

          <!-- Thread Grooves (Concentric Rings) -->
          <circle cx="50" cy="50" r="16" fill="none" stroke="#555" stroke-width="1" opacity="0.8" />
          <circle cx="50" cy="50" r="12" fill="none" stroke="#666" stroke-width="0.8" opacity="0.9" />
          <circle cx="50" cy="50" r="8" fill="none" stroke="#777" stroke-width="0.6" opacity="0.9" />
        </g>
      </svg>
    </div>
    
    <!-- Status Text -->
    <div class="loader-text">
      <span>ENGAGEMENT DE TRANSMISSION...</span>
    </div>
  </div>
</div>

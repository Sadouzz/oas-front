@if (loading) {
  <div class="no-print flex items-center justify-center min-h-screen bg-white">
    <div class="text-center">
      <div class="inline-block w-8 h-8 border-3 border-gray-900 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p class="text-xs text-gray-600 font-mono">Chargement du document...</p>
    </div>
  </div>
} @else if (error) {
  <div class="no-print p-8 text-center bg-white min-h-screen flex flex-col items-center justify-center">
    <p class="text-red-600 font-semibold mb-3">{{ error }}</p>
    <button (click)="fermer()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded text-xs font-semibold cursor-pointer">
      Fermer
    </button>
  </div>
} @else if (documentData) {
  @if (type === 'devis' || type === 'devis-previsionnel') {
    <app-devis-previsionnel-print [data]="documentData"></app-devis-previsionnel-print>
  } @else if (type === 'proforma') {
    <app-proforma-print [data]="documentData"></app-proforma-print>
  }
}
